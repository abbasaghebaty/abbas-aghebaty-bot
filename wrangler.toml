name = "abbas-aghebaty-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# متغیرهای عمومی و غیرمحرمانه
[vars]
ADMIN_ID = "7548075013"
SUPPORT_RATE_LIMIT = "5"
SUPPORT_RATE_WINDOW = "60"

# دیتابیس D1
[[d1_databases]]
binding = "DB"
database_name = "abbas-aghebaty-bot"
database_id = "df9f5c73-eedb-4352-bde6-5b8aea6167e0"

# صف پشتیبانی و پیام‌رسانی به‌صورت زمان‌بندی‌شده پردازش می‌شود.
[triggers]
crons = ["* * * * *"]

# Secrets موردنیاز:
# BOT_TOKEN
# GOOGLE_SERVICE_ACCOUNT_JSON
# MESSAGING_BOTS_JSON  (آرایه JSON شامل id، name و token ربات‌های متصل)
# MESSAGING_SYNC_SECRET (رمز مشترک endpoint همگام‌سازی مخاطبان)
