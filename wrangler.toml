name = "abbas-aghebaty-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# متغیرهای عمومی و غیرمحرمانه
[vars]
SUPPORT_RATE_LIMIT = "5"
SUPPORT_RATE_WINDOW = "60"

# دیتابیس D1
[[d1_databases]]
binding = "DB"
database_name = "abbas-aghebaty-bot"
database_id = "df9f5c73-eedb-4352-bde6-5b8aea6167e0"

# Secretها را در Cloudflare تنظیم کن:
# npx wrangler secret put BOT_TOKEN
# npx wrangler secret put ADMIN_ID
