name = "abbas-aghebaty-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# متغیرهای عمومی و غیرمحرمانه
[vars]
# شناسه عددی مدیر، credential محسوب نمی‌شود و برای حفظ تنظیم قبلی در vars می‌ماند.
ADMIN_ID = "7548075013"
SUPPORT_RATE_LIMIT = "5"
SUPPORT_RATE_WINDOW = "60"

# دیتابیس D1
[[d1_databases]]
binding = "DB"
database_name = "abbas-aghebaty-bot"
database_id = "df9f5c73-eedb-4352-bde6-5b8aea6167e0"

# تلاش مجدد خودکار برای پاسخ‌های ناموفق پشتیبانی، هر دقیقه
[triggers]
crons = ["* * * * *"]

# توکن ربات فقط باید به‌صورت Secret در Cloudflare تنظیم شود:
# npx wrangler secret put BOT_TOKEN
